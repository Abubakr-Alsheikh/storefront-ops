# Netlify detects Next.js and applies its Next.js runtime automatically.
# The Hono API runs inside the Next.js route handler at src/app/api/[[...route]]/route.ts.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Scheduled functions (the nightly demo reset) live here.
[functions]
  directory = "netlify/functions"
